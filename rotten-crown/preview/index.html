<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Rotten Crown | تجربة المشهد</title>
<style>
html,body { margin:0; width:100%; height:100%; background:#0b1210; color:#dddcc4; overflow:hidden; font-family:system-ui,sans-serif; }
#canvas { display:block; width:100%; height:100%; outline:0; touch-action:none; }
#status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; padding:2rem; text-align:center; background:#101a16; }
#status strong { font-size:1.4rem; letter-spacing:.12em; direction:ltr; }
#message { max-width:36rem; line-height:1.8; }
progress { width:min(18rem,80vw); accent-color:#a3b887; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="status"><strong>ROTTEN CROWN</strong><span id="message">جارٍ تحميل التجربة… يُفضّل استخدام الوضع الأفقي للهاتف.</span><progress id="progress"></progress></div>
<script src="godot.js"></script>
<script>
(async () => {
  const status = document.getElementById('status');
  const message = document.getElementById('message');
  const progress = document.getElementById('progress');
  try {
    let exited = false;
    const engine = new Engine({
      canvas: document.getElementById('canvas'),
      canvasResizePolicy: 2,
      executable: 'godot',
      mainPack: 'game.pck',
      onProgress: (current, total) => { if (total) { progress.max = total; progress.value = current; } },
      onExit: code => { exited = true; status.style.display = 'flex'; message.textContent = 'توقفت اللعبة (رمز ' + code + '). أعد تحميل الصفحة للمحاولة مجددًا.'; }
    });
    await engine.startGame();
    if (!exited) status.style.display = 'none';
  } catch (error) {
    console.error(error);
    progress.hidden = true;
    message.textContent = 'تعذّر تشغيل المعاينة: ' + error.message + '. جرّب متصفحًا يدعم WebGL 2، ثم أعد تحميل الصفحة.';
  }
})();
</script>
</body>
</html>
