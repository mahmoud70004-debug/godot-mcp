name: Probe direct game hosting
on:
  push:
    branches: [arena/29bc081f-godot-mcp]
    paths: [.github/workflows/arena-direct-host-probe.yml]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        host: [githack, htmlpreview]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run actual phone-mode Chromium test
        env:
          HOST: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HOST" = githack ]; then
            export SITE_URL='https://raw.githack.com/mahmoud70004-debug/godot-mcp/arena/29bc081f-godot-mcp/docs/index.html'
          else
            export SITE_URL='https://htmlpreview.github.io/?https://github.com/mahmoud70004-debug/godot-mcp/blob/arena/29bc081f-godot-mcp/docs/index.html?preview=1'
          fi
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.64.1 >/dev/null
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export PREVIEW_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > "$RUNNER_TEMP/probe.cjs" <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const bad=[];
            const browser=await chromium.launch({executablePath:process.env.PREVIEW_CHROME,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist','--autoplay-policy=no-user-gesture-required']});
            const ctx=await browser.newContext({viewport:{width:844,height:390},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            page.on('pageerror',e=>bad.push('JS: '+e.message));
            page.on('console',m=>{if(/SCRIPT ERROR|ERROR:/.test(m.text()))bad.push('GODOT: '+m.text().slice(0,180))});
            page.on('response',r=>{if(r.status()>=400)bad.push('HTTP '+r.status()+' '+r.url().split('?')[0].slice(-120))});
            try {
              const url=process.env.SITE_URL + (process.env.SITE_URL.includes('?')?'&':'?')+'debug=1';
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              const confirm=page.getByRole('button',{name:'Open the page'});
              if(await confirm.count()) {
                console.log('::notice title=External confirmation::Provider asks visitor to confirm before showing HTML');
                await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:30000}),confirm.click()]);
              }
              await page.waitForSelector('#rc-wake:not([disabled])',{timeout:150000});
              await page.tap('#rc-wake');
              await page.waitForFunction(()=>getComputedStyle(document.getElementById('status')).display==='none',null,{timeout:15000});
              await page.waitForTimeout(4000);
              const box=await page.locator('canvas').boundingBox();
              const scale=box.height/360, uiW=box.width/scale;
              const P=(x,y)=>({x:box.x+x*scale,y:box.y+y*scale});
              let p=P(60,230);await page.touchscreen.tap(p.x,p.y);
              await page.waitForTimeout(9000);
              p=P(uiW-39,16);await page.touchscreen.tap(p.x,p.y);
              await page.waitForFunction(()=>window.rcState&&window.rcState.scene==='ValdronOverworld',null,{timeout:90000});
              await page.waitForTimeout(1000);
              if(bad.length) throw new Error(bad.slice(0,3).join(' | '));
              console.log('::notice title=Public browser result::'+process.env.HOST+' reached the real Valdron overworld without page errors');
            } catch(e) {
              const message=(bad.length?bad.slice(0,3).join(' | '):String(e.message)).replace(/[\r\n%]/g,' ').slice(0,400);
              console.log('::error title=Public browser result::'+process.env.HOST+' failed: '+message);
              await browser.close();
              process.exit(1);
            }
            await browser.close();
          })();
          JS
          node "$RUNNER_TEMP/probe.cjs"
