name: Temporary independent Rotten Crown preview

# A disposable, one-hour anonymous preview for immediate testing. This does NOT
# deploy to GitHub Pages or write to another branch. It is not a replacement
# for connecting an owned Netlify site to the Arena branch for auto-updates.
on:
  push:
    branches:
      - arena/29bc081f-godot-mcp
    paths:
      - .github/workflows/arena-anonymous-web-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare only the Rotten Crown export
        run: bash rotten-crown/tools/prepare_web_host.sh
      - name: Publish a temporary anonymous snapshot
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/netlify-anonymous-output.json"
          errors="$RUNNER_TEMP/netlify-anonymous-errors.txt"
          trap 'rm -f "$output" "$errors"' EXIT
          if ! npx --yes netlify-cli@27.16.2 deploy --dir="$GITHUB_WORKSPACE/rotten-crown/build/netlify" \
            --no-build --allow-anonymous --created-via=cli --json >"$output" 2>"$errors"; then
            echo 'Anonymous publishing failed; reporting only sanitized error categories.' >&2
            diagnostic="$RUNNER_TEMP/preview-diagnostic.txt"
            python3 - "$output" "$errors" "$diagnostic" <<'PY'
          from pathlib import Path
          import re
          import sys
          text = '\n'.join(Path(p).read_text(errors='replace') for p in sys.argv[1:3] if Path(p).exists())
          checks = {
              'rate limited': r'\b429\b|rate.?limit|daily.limit',
              'not authorized': r'\b40[13]\b|unauthori[sz]ed|forbidden|not logged in',
              'file or deploy too large': r'\b413\b|too large|size.limit|file size',
              'missing path': r'ENOENT|directory (?:does not exist|not found)|no such file',
              'network or TLS error': r'ENOTFOUND|ECONN|ETIMEDOUT|fetch failed|certificate|TLS',
              'npm installation error': r'npm (?:ERR!|error)|ERR_PNPM|EBADENGINE',
              'service failure': r'\b50[0234]\b|service unavailable',
          }
          labels = [label for label, pattern in checks.items() if re.search(pattern, text, flags=re.I)]
          codes = sorted(set(re.findall(r'\b(?:ERR_[A-Z_]+|E(?:ACCES|AGAIN|CONNRESET|CONNREFUSED|HOSTUNREACH|NOTFOUND|TIMEDOUT))\b', text)))
          safe = ', '.join(labels + codes) or 'unclassified anonymous deploy error'
          print('DIAGNOSTIC:', safe, file=sys.stderr)
          Path(sys.argv[3]).write_text(safe[:120])
          PY
            echo "::error title=Temporary hosting diagnosis::$(cat "$diagnostic")"
            rm -f "$diagnostic"
            exit 1
          fi
          # The JSON can also contain a one-time claim token. Never log or retain it.
          site_url="$(node -e 'try {const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1]));if(d.password)throw 0;if(!/^https:\/\/[a-z0-9-]+\.netlify\.app\/?$/i.test(d.site_url))throw 0;process.stdout.write(d.site_url.replace(/\/$/,""))}catch{console.error("Invalid or password-protected preview response");process.exit(1)}' "$output")"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_PREVIEW_URL=$site_url"
          echo "::notice title=Temporary preview URL::$site_url"
          echo 'This anonymous site expires after one hour unless claimed; it does not auto-update.'
      - name: Verify HTTP responses and isolation headers
        env:
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html index.js index.wasm index.pck index.service.worker.js; do
            curl --fail --location --silent --show-error --head --max-time 60 "$SITE_URL/$file" > "$RUNNER_TEMP/headers"
            echo "HTTP_OK $file"
          done
          curl --fail --location --silent --show-error --head --max-time 60 "$SITE_URL/index.html" > "$RUNNER_TEMP/index-headers"
          grep -qi 'cross-origin-opener-policy: same-origin' "$RUNNER_TEMP/index-headers"
          grep -qi 'cross-origin-embedder-policy: require-corp' "$RUNNER_TEMP/index-headers"
          echo 'HTTP_ISOLATION_HEADERS_PASS'
      - name: Run browser smoke test on the public URL
        env:
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.64.1 >/dev/null
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export PREVIEW_CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > "$RUNNER_TEMP/browser-patch.cjs" <<'JS'
          const pw = require('playwright');
          const original = pw.chromium.launch.bind(pw.chromium);
          pw.chromium.launch = opts => original({
            ...opts,
            executablePath: process.env.PREVIEW_CHROME,
            args: [...(opts.args || []), '--no-sandbox', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'],
          });
          JS
          node -r "$RUNNER_TEMP/browser-patch.cjs" rotten-crown/tools/web_smoke_test.cjs "$SITE_URL/index.html" "$RUNNER_TEMP/screenshots"
          echo 'PUBLIC_BROWSER_SMOKE_PASS'
      - name: Record the public test result
        if: always() && steps.deploy.outputs.site_url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.site_url }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            echo "::notice title=Verified temporary preview::$SITE_URL"
          else
            echo '::error title=Temporary preview::HTTP or browser validation failed'
          fi
